<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pxlshpr - Pixel Shipper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-purple: #c084fc;
            --accent-pink: #f472b6;
            --accent-teal: #2dd4bf;
            --accent-gold: #d4a944;
            --nutrikit-purple: #5D00FF;
            --nutrikit-light: #A164FF;
            --chunes-pink: #f472b6;
            --chunes-purple: #c084fc;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background gradient */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(192, 132, 252, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(244, 114, 182, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(45, 212, 191, 0.05) 0%, transparent 50%);
            animation: gradientShift 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-image-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
        }

        .profile-image-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink), var(--accent-teal));
            animation: ringRotate 4s linear infinite;
        }

        @keyframes ringRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .profile-image {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-primary);
            animation: profileBounce 3s ease-in-out infinite;
        }

        @keyframes profileBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .username {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShimmer 3s ease-in-out infinite;
            margin-bottom: 8px;
        }

        @keyframes textShimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .username-expand {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .username-expand span {
            color: var(--accent-teal);
        }

        .real-name {
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 6px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.5s forwards;
        }

        .instagram-handle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.6s forwards;
        }

        .instagram-handle a {
            color: var(--text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(244, 114, 182, 0.1);
            border: 1px solid rgba(244, 114, 182, 0.2);
            transition: all 0.3s ease;
        }

        .instagram-handle a:hover {
            color: var(--accent-pink);
            background: rgba(244, 114, 182, 0.2);
            border-color: var(--accent-pink);
            transform: scale(1.05);
        }

        .instagram-icon {
            width: 16px;
            height: 16px;
            transition: transform 0.3s;
        }

        .instagram-handle a:hover .instagram-icon {
            transform: rotate(10deg);
        }

        .role {
            font-size: 1.1rem;
            color: var(--text-secondary);
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.7s forwards;
        }

        .role strong {
            color: var(--accent-gold);
        }

        /* Apps Section */
        .apps-section {
            width: 100%;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.9s forwards;
        }

        .apps-title {
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (max-width: 600px) {
            .apps-grid {
                grid-template-columns: 1fr;
            }
        }

        /* App Card Base */
        .app-card {
            position: relative;
            border-radius: 24px;
            padding: 32px 24px;
            text-decoration: none;
            color: var(--text-primary);
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 320px;
        }

        .app-card:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .app-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, var(--card-accent), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .app-card:hover::before {
            opacity: 1;
        }

        /* NutriKit Card */
        .app-card.nutrikit {
            --card-accent: var(--nutrikit-light);
            background: linear-gradient(145deg, rgba(93, 0, 255, 0.15), rgba(45, 212, 191, 0.1));
            box-shadow: 0 8px 32px rgba(93, 0, 255, 0.2);
        }

        .app-card.nutrikit:hover {
            box-shadow: 0 16px 48px rgba(93, 0, 255, 0.35);
        }

        /* Chunes Card */
        .app-card.chunes {
            --card-accent: var(--chunes-pink);
            background: linear-gradient(145deg, rgba(192, 132, 252, 0.15), rgba(244, 114, 182, 0.1));
            box-shadow: 0 8px 32px rgba(192, 132, 252, 0.2);
        }

        .app-card.chunes:hover {
            box-shadow: 0 16px 48px rgba(244, 114, 182, 0.35);
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 16px;
            animation: iconBounce 2s ease-in-out infinite;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .app-card:nth-child(2) .app-icon {
            animation-delay: 0.5s;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-6px) rotate(-2deg); }
            75% { transform: translateY(-6px) rotate(2deg); }
        }

        .app-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .nutrikit .app-name {
            background: linear-gradient(135deg, var(--nutrikit-light), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chunes .app-name {
            background: linear-gradient(135deg, var(--chunes-purple), var(--chunes-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-tagline {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .app-cta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .nutrikit .app-cta {
            background: rgba(93, 0, 255, 0.2);
            color: var(--nutrikit-light);
            border: 1px solid rgba(93, 0, 255, 0.3);
        }

        .nutrikit:hover .app-cta {
            background: rgba(93, 0, 255, 0.4);
            border-color: var(--nutrikit-light);
        }

        .chunes .app-cta {
            background: rgba(244, 114, 182, 0.2);
            color: var(--chunes-pink);
            border: 1px solid rgba(244, 114, 182, 0.3);
        }

        .chunes:hover .app-cta {
            background: rgba(244, 114, 182, 0.4);
            border-color: var(--chunes-pink);
        }

        /* Footer */
        .footer {
            margin-top: 60px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 1.2s forwards;
        }

        .footer-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .footer-text span {
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
            color: var(--accent-pink);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            40% { transform: scale(1); }
            60% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="particles" id="particles"></div>

    <div class="container">
        <section class="profile">
            <div class="profile-image-container">
                <div class="profile-image-ring"></div>
                <img src="profile.jpg" alt="Ahmed Ragheb Khalaf" class="profile-image">
            </div>

            <h1 class="username">pxlshpr</h1>
            <p class="username-expand">/ <span>p</span>i<span>x</span>e<span>l</span> <span>sh</span>i<span>pp</span>e<span>r</span> /</p>

            <p class="real-name">Ahmed Ragheb Khalaf</p>
            <p class="instagram-handle">
                <a href="https://instagram.com/ahmdrghb" target="_blank" rel="noopener noreferrer">
                    <svg class="instagram-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                    @ahmdrghb
                </a>
            </p>

            <p class="role"><strong>UX Engineer</strong> crafting delightful apps</p>
        </section>

        <section class="apps-section">
            <h2 class="apps-title">Currently Building</h2>

            <div class="apps-grid">
                <a href="https://getnutrikit.app" target="_blank" rel="noopener noreferrer" class="app-card nutrikit">
                    <img src="nutrikit-icon.png" alt="NutriKit" class="app-icon">
                    <h3 class="app-name">NutriKit</h3>
                    <p class="app-tagline">Lightning-fast, accurate nutrition tracking</p>
                    <span class="app-cta">Explore &rarr;</span>
                </a>

                <a href="https://getchunes.app" target="_blank" rel="noopener noreferrer" class="app-card chunes">
                    <img src="chunes-icon.png" alt="Chunes" class="app-icon">
                    <h3 class="app-name">Chunes</h3>
                    <p class="app-tagline">Tag your music, create mixes, drop markers</p>
                    <span class="app-cta">Explore &rarr;</span>
                </a>
            </div>
        </section>

        <footer class="footer">
            <p class="footer-text">Made with <span>&hearts;</span> and lots of coffee</p>
        </footer>
    </div>

    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        const colors = ['#c084fc', '#f472b6', '#2dd4bf', '#5D00FF', '#d4a944'];

        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            particle.style.width = (3 + Math.random() * 4) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        // Add subtle parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;

            document.querySelector('.bg-gradient').style.transform =
                `translate(${x}px, ${y}px) scale(1.1)`;
        });
    </script>
</body>
</html>
