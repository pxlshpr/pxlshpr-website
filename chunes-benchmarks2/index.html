const DATA = {"summary": {"deepseek-v4-flash": {"avgScore": 6.17, "n": 59, "wins": 13, "worst": 16}, "gemini-3.1-flash-lite": {"avgScore": 6.7, "n": 60, "wins": 11, "worst": 11}, "gemini-2.5-flash": {"avgScore": 6.73, "n": 60, "wins": 6, "worst": 5}, "opus": {"avgScore": 7.73, "n": 60, "wins": 23, "worst": 3}, "gemini-2.5-flash-lite": {"avgScore": 5.46, "n": 60, "wins": 7, "worst": 25}}, "perSong": [{"stratum": "popular", "artist": "Fred again.. & Delilah Montagu", "title": "Delilah (pull me out of this)", "album": "Actual Life 3 (January 1 - September 9 2022)", "isrc": "GBAHS2201028", "identified": true, "actual": "Fred again.. & Delilah Montagu — \"Delilah (pull me out of this)\" (Actual Life 3, 2022) is a euphoric, high-energy HOUSE / dance track (some call it garage house), co-produced with Four Tet. It HAS vocals: chopped/sampled vocals from Delilah Montagu (sampled from her 2021 \"Lost Keys\" kitchen performance) — Fred again's signature sample-driven method. Core instruments: synthesizers (funky synths), drum machine/programmed drums with crispy percussion and bass-heavy kicks, and a vocal sampler as the defining element. Mood is uplifting/energetic/euphoric with a bittersweet nostalgic undertone (the title references a panic attack in a club). Correct profile: Electronic/House, with-vocals, Synthesizer + Drum Machine + Sampler, energetic/uplifting/nostalgic. A dancefloor banger, NOT a calm/study/relax track. Won Best Dance/Electronic Album at the 2024 Grammys.", "best": "gemini-3.1-flash-lite", "worst": "deepseek-v4-flash", "tagsByModel": {"deepseek-v4-flash": {"genres": ["Electronic", "House"], "moods": ["Calm", "Dreamy", "Nostalgic", "Sad"], "activities": ["Relaxing", "Working", "Studying"], "instruments": ["Synthesizer", "Sampler", "Piano"], "tags": [], "vocals": "with-vocals"}, "gemini-3.1-flash-lite": {"genres": ["Electronic", "House"], "moods": ["Energetic", "Uplifting", "Dreamy", "Nostalgic"], "activities": ["Driving", "Party", "Working"], "instruments": ["Synthesizer", "Drum Machine", "Sampler"], "tags": [], "vocals": "with-vocals"}, "gemini-2.5-flash": {"genres": ["Electronic", "House"], "moods": ["Uplifting", "Dreamy", "Nostalgic"], "activities": ["Working", "Driving", "Relaxing"], "instruments": ["Synthesizer", "Drum Machine"], "tags": [], "vocals": "with-vocals"}, "opus": {"genres": ["Electronic", "House"], "moods": ["Uplifting", "Energetic", "Nostalgic", "Dreamy"], "activities": ["Party", "Driving", "Working"], "instruments": ["Synthesizer", "Piano", "Drum Machine"], "tags": [], "vocals": "with-vocals"}, "gemini-2.5-flash-lite": {"genres": ["Electronic", "House", "Pop"], "moods": ["Uplifting", "Energetic", "Nostalgic"], "activities": ["Party", "Driving", "Working"], "instruments": ["Synthesizer", "Drums", "Sampler"], "tags": [], "vocals": "with-vocals"}}, "ratings": [{"model": "deepseek-v4-flash", "score": 5, "genre": "correct", "vocals": "correct", "notes": "Genre (Electronic/House) and with-vocals correct, and Synth/Sampler/Piano instruments are mostly plausible (Sampler is right; Piano secondary). But the mood/activity profile is inverted: 'Calm' and 'Sad' plus 'Relaxing/Studying' frame this as a low-energy study/wind-down track, when it's actually a high-energy euphoric dancefloor banger. Right genre, wrong energy."}, {"model": "gemini-3.1-flash-lite", "score": 9, "genre": "correct", "vocals": "correct", "notes": "Electronic/House and with-vocals correct. Moods Energetic/Uplifting/Dreamy/Nostalgic nail the euphoric-but-bittersweet feel. Activities Driving/Party fit a dancefloor track. Instruments Synthesizer/Drum Machine/Sampler are exactly the three defining production elements (incl. the vocal sampler). Best fit overall."}, {"model": "gemini-2.5-flash", "score": 7, "genre": "correct", "vocals": "correct", "notes": "Electronic/House and with-vocals correct. Uplifting/Dreamy/Nostalgic are good but it omits Energetic, slightly underselling the banger energy; 'Relaxing' activity is a minor miss. Instruments only Synthesizer + Drum Machine — missing the prominent vocal Sampler that defines the track. Solid but a step below B/D/E."}, {"model": "opus", "score": 8, "genre": "correct", "vocals": "correct", "notes": "Electronic/House and with-vocals correct. Moods Uplifting/Energetic/Nostalgic/Dreamy nail it; Party/Driving activities fit. Instruments Synthesizer/Piano/Drum Machine are good but uses Piano instead of Sampler — Sampler (chopped vocals) is the more defining element here. Strong, just shy of B."}, {"model": "gemini-2.5-flash-lite", "score": 8, "genre": "correct", "vocals": "correct", "notes": "Electronic/House/Pop and with-vocals correct; Pop is defensible given the vocal hook and crossover appeal. Moods Uplifting/Energetic/Nostalgic good. Party/Driving activities fit. Instruments Synthesizer/Drums/Sampler are good (generic 'Drums' vs 'Drum Machine' is a slight downgrade but acceptable). Strong fit."}]}, {"stratum": "popular", "artist": "Fit for a King", "title": "Falling Through the Sky", "album": "The Hell We Create", "isrc": "", "identified": true, "actual": "\"Falling Through the Sky\" by Fit for a King, from the 2022 album \"The Hell We Create\" (Solid State Records). Fit for a King is an American melodic metalcore band rooted in metal/hardcore. This specific track is one of the album's more anthemic, modern-rock-leaning cuts — described as a \"stratospheric/anthemic rock song\" — but it is firmly within metalcore: heavy distorted guitars, driving bass, double-bass/big drums, and DUAL vocals (clean melodic \"angelic\" singing in choruses + harsh screamed vocals in heavier sections). Core genre = Metalcore / Melodic Metalcore. Definitely with-vocals. Mood is intense, dark, anthemic/emotional. NOT prog metal or djent (no technical/polyrhythmic riff focus). Instruments: guitar, bass, drums.", "best": "deepseek-v4-flash", "worst": "gemini-2.5-flash-lite", "tagsByModel": {"opus": {"genres": ["Metal", "Hardcore"], "moods": ["Intense", "Dark", "Fierce", "Energetic"], "activities": ["Workout", "Driving"], "instruments": ["Guitar", "Drums", "Bass"], "tags": [], "vocals": "with-vocals"}, "deepseek-v4-flash": {"genres": ["Metal", "Metalcore"], "moods": ["Intense", "Dark", "Energetic", "Fierce"], "activities": ["Workout", "Driving"], "instruments": ["Guitar", "Bass", "Drums"], "tags": [], "vocals": "with-vocals"}, "gemini-2.5-flash": {"genres": ["Metal", "Prog Metal"], "moods": ["Intense", "Fierce", "Dark"], "activities": ["Workout"], "instruments": ["Guitar", "Drums", "Bass"], "tags": [], "vocals": "with-vocals"}, "gemini-2.5-flash-lite": {"genres": ["Metal", "Djent"], "moods": ["Intense", "Fierce", "Dark"], "activities": ["Workout"], "instruments": ["Guitar", "Drums", "Bass"], "tags": [], "vocals": "with-vocals"}, "gemini-3.1-flash-lite": {"genres": ["Metal", "Metalcore"], "moods": ["Intense", "Fierce", "Dark"], "activities": ["Workout", "Driving"], "instruments": ["Guitar", "Bass", "Drums"], "tags": [], "vocals": "with-vocals"}}, "ratings": [{"model": "opus", "score": 8, "genre": "partial", "vocals": "correct", "notes": "Metal + Hardcore is correct lineage (FFAK comes from metal/hardcore) but misses the specific and defining 'Metalcore' label. Moods (Intense/Dark/Fierce/Energetic) fit well. Instruments Guitar/Drums/Bass exactly right. Vocals with-vocals correct. Solid but slightly less precise than the systems that named Metalcore directly."}, {"model": "deepseek-v4-flash", "score": 10, "genre": "correct", "vocals": "correct", "notes": "Metal + Metalcore is exactly the right genre for this melodic-metalcore track. Moods (Intense/Dark/Energetic/Fierce) appropriate. Instruments Guitar/Bass/Drums correct. Vocals with-vocals correct (clean + harsh dual vocals). Best possible characterization within the vocabulary."}, {"model": "gemini-2.5-flash", "score": 6, "genre": "partial", "vocals": "correct", "notes": "Metal is right but 'Prog Metal' is wrong — FFAK is melodic metalcore, not progressive metal (no extended/technical compositional prog focus). Moods and instruments correct, vocals correct. The Prog Metal mislabel pulls it down; Metalcore or even Hardcore would have been the accurate sub-genre."}, {"model": "gemini-2.5-flash-lite", "score": 5, "genre": "partial", "vocals": "correct", "notes": "Metal is right but 'Djent' is wrong — this is anthemic melodic metalcore, not djent (no signature palm-muted polyrhythmic low-tuned chug as the defining trait, especially on this more modern-rock/anthemic single). Moods and instruments correct, vocals correct. The Djent mislabel is the least accurate sub-genre guess of the five."}, {"model": "gemini-3.1-flash-lite", "score": 10, "genre": "correct", "vocals": "correct", "notes": "Metal + Metalcore exactly right. Moods (Intense/Fierce/Dark) appropriate, activities Workout/Driving fit the energy. Instruments Guitar/Bass/Drums correct, vocals with-vocals correct. Tied with B as the most accurate; arguably matches the anthemic energy with the Driving activity."}]}, {"stratum": "popular", "artist": "Calvin Harris & Rag'n'Bone Man", "title": "Giant (Robin Schulz Remix)", "album": "Giant (Remixes)", "isrc": "", "identified": true, "actual": "2019 progressive/future house remix of the Calvin Harris & Rag'n'Bone Man crossover hit \"Giant.\" Genre: pop-dance / EDM — specifically shimmering progressive house (also tagged future house) with a four-on-the-floor groove and big festival build. Billboard describes Schulz replacing the original's funky horns with \"soulful piano riffs and wild female voices\" over progressive-house accents — so PIANO is a signature, prominent instrument here, alongside synthesizers and programmed drums/drum machine. Definitely WITH-VOCALS: retains Rag'n'Bone Man's gritty soulful male lead plus added female vocal textures. Mood: energetic, uplifting, anthemic, confident, happy. Activities: party, workout, driving fit well. Core correct tag set ~ Electronic + House + Pop; instruments Synthesizer + Piano + Drum Machine; vocals with-v const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const emoji=n=>DATA.emoji[(n||'').toLowerCase()]||'';
const ORDER=DATA.order, LABEL=DATA.label, S=DATA.perSong;

(function(){let mode=localStorage.getItem('th3')||'auto';const btn=$('#themeBtn');
  const apply=()=>{if(mode==='auto')document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',mode);
    btn.textContent={auto:'◐ Auto',light:'☀︎ Light',dark:'☾ Dark'}[mode];};
  btn.onclick=()=>{mode={auto:'light',light:'dark',dark:'auto'}[mode];localStorage.setItem('th3',mode);apply();};apply();})();

$('#metaline').textContent=`${S.length} songs blind-judged · GA-stable challengers (no preview) vs cached Opus 4.8 · #1661`;

/* summary cards */
const sum=DATA.summary;
const best=Object.entries(sum).sort((a,b)=>b[1].avgScore-a[1].avgScore)[0]?.[0];
$('#verdict').innerHTML=ORDER.filter(m=>sum[m]).map(m=>{
  const s=sum[m];const win=m===best;
  return `<div class="vc ${win?'win':''}"><h3>${win?'🏆 ':''}${esc(LABEL[m])}</h3>
    <div class="big">${s.avgScore.toFixed(2)}<small>/10</small></div>
    <div><span class="badge good">${s.wins} best</span><span class="badge warn">${s.worst} worst</span><span class="badge">n=${s.n}</span></div></div>`;}).join('');

/* leaderboard */
const rows=ORDER.filter(m=>sum[m]).map(m=>({m,...sum[m]})).sort((a,b)=>b.avgScore-a.avgScore);
$('#board').innerHTML='<thead><tr><th>Model</th><th>Avg /10</th><th>Best picks</th><th>Worst picks</th></tr></thead><tbody>'+
  rows.map(r=>`<tr><td>${esc(LABEL[r.m])}</td><td>${r.avgScore.toFixed(2)}<span class="bar" style="width:${Math.round(r.avgScore/10*46)}px"></span></td><td>${r.wins}</td><td>${r.worst}</td></tr>`).join('')+'</tbody>';

/* explorer */
let curStratum='all', curSong=0;
const SECTS=[['genres','Genres'],['moods','Moods'],['activities','Activities'],['instruments','Instruments'],['tags','Tags']];
function filtered(){return S.map((s,i)=>({s,i})).filter(o=>curStratum==='all'||o.s.stratum===curStratum);}
(function(){const strata=['all','popular','obscure','instrumental'];
  $('#stratumFilter').innerHTML=strata.map(st=>`<button class="pill ${st==='all'?'on':''}" data-st="${st}">${st==='all'?'All':cap(st)}</button>`).join('');
  $('#stratumFilter').querySelectorAll('.pill').forEach(btn=>btn.onclick=()=>{curStratum=btn.dataset.st;
    $('#stratumFilter').querySelectorAll('.pill').forEach(x=>x.classList.toggle('on',x===btn));curSong=0;buildSel();render();});})();
function buildSel(){const sel=$('#songsel');const fs=filtered();
  sel.innerHTML=fs.map((o,k)=>`<option value="${k}">${esc(o.s.artist)} — ${esc(o.s.title)} [${o.s.stratum[0]}]</option>`).join('');
  sel.value=Math.min(curSong,fs.length-1);}
$('#songsel').onchange=e=>{curSong=+e.target.value;render();};
$('#prev').onclick=()=>{const n=filtered().length;curSong=(curSong-1+n)%n;$('#songsel').value=curSong;render();};
$('#next').onclick=()=>{const n=filtered().length;curSong=(curSong+1)%n;$('#songsel').value=curSong;render();};
function cur(){const fs=filtered();return fs[Math.min(curSong,fs.length-1)]?.s;}
function chip(n){return `<span class="chip">${emoji(n)?`<span class="e">${emoji(n)}</span>`:''}${esc(n)}</span>`;}
function card(song,m){
  const t=(song.tagsByModel||{})[m]||{};
  const rt=(song.ratings||[]).find(r=>r.model===m);
  const isCtrl=m==='opus', isBest=song.best===m;
  const c=el('div','tagcard'+(isCtrl?' control':'')+(isBest?' best':''));
  const sc=rt?Math.round(rt.score):null;
  const scoreHtml=rt?`<span class="scorepill s${sc}">${rt.score}</span>`:'';
  c.appendChild(el('div','ch',`<span class="name">${isCtrl?'★ ':''}${isBest?'🏆 ':''}${esc(LABEL[m])}</span>${scoreHtml}`));
  const voc=t.vocals||'unknown';
  c.appendChild(el('div','sect',`<div class="h">VOCALS</div><div class="chips"><span class="chip"><span class="e">${DATA.vocalIcon[voc]||'❔'}</span>${esc(voc)}</span></div>`));
  SECTS.forEach(([k,title])=>{const arr=t[k]||[];if(!arr.length)return;
    c.appendChild(el('div','sect',`<div class="h">${title.toUpperCase()}</div><div class="chips">${arr.map(chip).join('')}</div>`));});
  if(rt)c.appendChild(el('div','jnotes',`<b>${esc(rt.genre)}</b> genre · <b>${esc(rt.vocals)}</b> vocals — ${esc(rt.notes)}`));
  return c;
}
function render(){buildSel();const s=cur();if(!s)return;
  $('#songhead').innerHTML=`<div class="art">${emoji((s.tagsByModel.opus.genres||[])[0])||'🎵'}</div>
    <div><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div>
    <div class="m">${esc(s.album||'')} · <span class="badge">${s.stratum}</span></div></div>`;
  $('#actual').innerHTML=`<b>WHAT IT ACTUALLY IS</b><br>${esc(s.actual)}`;
  const wrap=$('#cards');wrap.innerHTML='';
  ORDER.filter(m=>s.tagsByModel&&s.tagsByModel[m]).forEach(m=>wrap.appendChild(card(s,m)));}
buildSel();render();
$('#foot').textContent=`Blind ${ORDER.length}-way judge · 60 songs · #1661 · flash variants run reasoning-off`;
